# On every push / pull request: unit tests, viewer build, then build the Docker image and test it end to end
# with 2 CPUs and 16 GB. On main: the image is pushed to GHCR and the website is deployed to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  HF_REPO: ${{ vars.HF_REPO || 'MohammadSakibHossain/brain-tumor-segmentation-mlops' }}   # large files on the Hugging Face Hub
  IMAGE: ghcr.io/${{ github.repository_owner }}/brain-tumor-segmentation

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install (CPU)
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/api.txt pytest httpx
      - name: Unit tests
        run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    needs: [tests, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (torch + models need room)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: brain-seg:test
          build-args: HF_REPO=${{ env.HF_REPO }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container (Space-sized limits)
        run: |
          docker run -d --name app -p 7860:7860 --memory 16g --cpus 2 brain-seg:test
          for i in $(seq 1 60); do
            curl -sf http://localhost:7860/api/health && exit 0
            sleep 2
          done
          docker logs app; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: End-to-end test (upload, segment, extra model, mistakes)
        run: |
          pip install httpx==0.28.1 huggingface_hub==2.4.0 nibabel==5.5.0 numpy==2.4.6
          python scripts/hub.py download --repo "$HF_REPO" --what samples --to .
          python api/test_api.py http://localhost:7860
      - name: Viewer is served
        run: |
          curl -sf http://localhost:7860/ | grep -q "<canvas\|<div id=\"app\"\|<html"
          curl -sf http://localhost:7860/models.html > /dev/null
      - name: Memory used
        if: always()
        run: docker stats --no-stream app; docker logs app | tail -30

      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')   # Docker image names must be lowercase
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag brain-seg:test $IMAGE:latest
          docker tag brain-seg:test $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}

  pages:
    # continuous deployment of the website: only after the tests, the viewer build and the container's
    # end-to-end test pass on main. Free GitHub Pages needs a public repository, so it waits for that.
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Gallery brains and sample downloads from the Hugging Face Hub
        run: |
          pip install huggingface_hub==2.4.0
          python scripts/hub.py download --repo "$HF_REPO" --what cases samples --to . --samples-dir web/public/samples
      - name: Build the website
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
